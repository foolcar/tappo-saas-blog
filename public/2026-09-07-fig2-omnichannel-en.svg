<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1280" viewBox="0 0 800 1280" role="img" aria-labelledby="title desc">
  <title id="title">Omnichannel Operating Architecture for Restaurant Groups</title>
  <desc id="desc">Customer channels first enter an omnichannel transaction hub, then flow to a lightweight POS for restaurant fulfilment. An open integration platform connects providers, while the enterprise data foundation governs shared data.</desc>
  <defs>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#19345C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="1280" rx="32" fill="#F7F9FD"/>
  <rect x="0" y="0" width="14" height="1280" rx="7" fill="#365FD8"/>

  <text x="54" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="#17345D">Omnichannel Operating</text>
  <text x="54" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="#17345D">Architecture</text>
  <text x="54" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#62708A">Unified channels, restaurant fulfilment, decoupled data</text>

  <text x="54" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#365FD8">01  CUSTOMER CHANNELS</text>
  <rect x="54" y="232" width="692" height="112" rx="22" fill="#EAF7F6" stroke="#1BA7A1" stroke-width="3"/>
  <text x="400" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="700" fill="#18324F">Dine-in   Delivery   Pickup   Group Buying</text>
  <text x="400" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#344866">Reviews   Queue Management   Reservations</text>

  <line x1="400" y1="346" x2="400" y2="378" stroke="#365FD8" stroke-width="6"/>
  <polygon points="386,378 414,378 400,396" fill="#365FD8"/>

  <text x="54" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#365FD8">02  UNIFIED TRANSACTION RULES</text>
  <rect x="54" y="440" width="692" height="154" rx="26" fill="#EAF0FF" stroke="#365FD8" stroke-width="4" filter="url(#shadow2)"/>
  <text x="400" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="#17345D">Omnichannel Transaction Hub</text>
  <text x="400" y="550" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#3B4E70">Orders   Products   Members   Payments   Fulfilment</text>

  <line x1="400" y1="596" x2="400" y2="628" stroke="#365FD8" stroke-width="6"/>
  <polygon points="386,628 414,628 400,646" fill="#365FD8"/>

  <text x="54" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#365FD8">03  RESTAURANT TRANSACTIONS &amp; FULFILMENT</text>
  <rect x="54" y="690" width="692" height="128" rx="24" fill="#FFF7E9" stroke="#F2A31A" stroke-width="4"/>
  <text x="400" y="742" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="#4B3510">Lightweight POS / Fulfilment</text>
  <text x="400" y="786" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#5E4A26">Ordering   Checkout   Payment   Printing   Kitchen</text>

  <line x1="400" y1="820" x2="400" y2="852" stroke="#365FD8" stroke-width="6"/>
  <polygon points="386,852 414,852 400,870" fill="#365FD8"/>

  <text x="54" y="892" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#365FD8">04  OPEN INTEGRATION &amp; MANAGEMENT</text>
  <rect x="54" y="914" width="692" height="136" rx="24" fill="#F2EDFF" stroke="#7148E8" stroke-width="3"/>
  <text x="400" y="964" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="700" fill="#442A91">APIs   Events   MCP   Identity &amp; Access   Audit</text>
  <text x="400" y="1012" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#4B4168">Supply Chain   Finance   HR   Membership / CRM   HQ</text>

  <line x1="400" y1="1052" x2="400" y2="1084" stroke="#365FD8" stroke-width="6"/>
  <polygon points="386,1084 414,1084 400,1102" fill="#365FD8"/>

  <text x="54" y="1124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="700" fill="#365FD8">05  ENTERPRISE DATA FOUNDATION</text>
  <rect x="54" y="1146" width="692" height="110" rx="22" fill="#243B5A"/>
  <text x="400" y="1194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Master Data   Governance   Shared Metrics</text>
  <text x="400" y="1232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#DCE6F7">BI   AI Data Services   Definitions &amp; Access</text>
</svg>
