<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120" role="img" aria-labelledby="title desc">
  <title id="title">輕 POS：門店終端保留甚麼、放下甚麼</title>
  <desc id="desc">左側為保留在門店終端、不能中斷的現場能力；右側為交給全渠道交易中樞與數據底座、集中處理更好的責任。輕是責任邊界清楚，不是功能更少。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#19345C" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="1120" rx="32" fill="#F7F9FD"/>
  <rect x="0" y="0" width="14" height="1120" rx="7" fill="#365FD8"/>

  <text x="54" y="78" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="34" font-weight="700" fill="#17345D">輕 POS：門店終端保留甚麼、放下甚麼</text>
  <text x="54" y="120" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="22" fill="#62708A">輕是責任邊界清楚，不是功能更少</text>

  <!-- 左欄標題 -->
  <rect x="40" y="158" width="340" height="56" rx="16" fill="#1BA7A1"/>
  <text x="210" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">保留在門店終端</text>
  <text x="40" y="236" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" fill="#62708A">發生在現場、不能依賴遠端才成立</text>

  <!-- 右欄標題 -->
  <rect x="420" y="158" width="340" height="56" rx="16" fill="#365FD8"/>
  <text x="590" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">交給中樞與數據底座</text>
  <text x="420" y="236" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" fill="#62708A">跨門店跨渠道、需要統一規則與數據</text>

  <!-- 左欄卡片 -->
  <rect x="40" y="262" width="340" height="104" rx="18" fill="#EAF7F6" stroke="#1BA7A1" stroke-width="2"/>
  <circle cx="74" cy="314" r="7" fill="#1BA7A1"/>
  <text x="98" y="306" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">收銀與支付</text>
  <text x="98" y="338" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">斷網也要能結帳開單</text>

  <rect x="40" y="390" width="340" height="104" rx="18" fill="#EAF7F6" stroke="#1BA7A1" stroke-width="2"/>
  <circle cx="74" cy="442" r="7" fill="#1BA7A1"/>
  <text x="98" y="434" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">點餐與下單</text>
  <text x="98" y="466" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">現場點菜、改單、加單</text>

  <rect x="40" y="518" width="340" height="104" rx="18" fill="#EAF7F6" stroke="#1BA7A1" stroke-width="2"/>
  <circle cx="74" cy="570" r="7" fill="#1BA7A1"/>
  <text x="98" y="562" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">出餐與廚房打印</text>
  <text x="98" y="594" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">KDS 與打印機獨立運作</text>

  <rect x="40" y="646" width="340" height="104" rx="18" fill="#EAF7F6" stroke="#1BA7A1" stroke-width="2"/>
  <circle cx="74" cy="698" r="7" fill="#1BA7A1"/>
  <text x="98" y="690" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">履約狀態回傳</text>
  <text x="98" y="722" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">出餐取餐回到中樞</text>

  <rect x="40" y="774" width="340" height="104" rx="18" fill="#EAF7F6" stroke="#1BA7A1" stroke-width="2"/>
  <circle cx="74" cy="826" r="7" fill="#1BA7A1"/>
  <text x="98" y="818" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">離線容錯</text>
  <text x="98" y="850" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">網路不穩先本地完成</text>

  <!-- 右欄卡片 -->
  <rect x="420" y="262" width="340" height="104" rx="18" fill="#E8EEFB" stroke="#365FD8" stroke-width="2"/>
  <circle cx="454" cy="314" r="7" fill="#365FD8"/>
  <text x="478" y="306" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">跨渠道交易規則</text>
  <text x="478" y="338" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">堂食外賣自取同一規則</text>

  <rect x="420" y="390" width="340" height="104" rx="18" fill="#E8EEFB" stroke="#365FD8" stroke-width="2"/>
  <circle cx="454" cy="442" r="7" fill="#365FD8"/>
  <text x="478" y="434" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">會員與顧客身份</text>
  <text x="478" y="466" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">點數同意跨渠道共享</text>

  <rect x="420" y="518" width="340" height="104" rx="18" fill="#E8EEFB" stroke="#365FD8" stroke-width="2"/>
  <circle cx="454" cy="570" r="7" fill="#365FD8"/>
  <text x="478" y="562" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">營銷優惠計算</text>
  <text x="478" y="594" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">滿減折扣由中樞下達</text>

  <rect x="420" y="646" width="340" height="104" rx="18" fill="#E8EEFB" stroke="#365FD8" stroke-width="2"/>
  <circle cx="454" cy="698" r="7" fill="#365FD8"/>
  <text x="478" y="690" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">菜單價格庫存</text>
  <text x="478" y="722" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">中樞管理終端用確認版</text>

  <rect x="420" y="774" width="340" height="104" rx="18" fill="#E8EEFB" stroke="#365FD8" stroke-width="2"/>
  <circle cx="454" cy="826" r="7" fill="#365FD8"/>
  <text x="478" y="818" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#18324F">對賬財務口徑</text>
  <text x="478" y="850" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="17" fill="#5A6B82">營收退款定義統一</text>

  <!-- 底部結論 -->
  <rect x="40" y="914" width="720" height="112" rx="20" fill="#243B5A" filter="url(#shadow)"/>
  <text x="400" y="962" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">輕 POS 的輕，是責任的輕，不是能力的輕</text>
  <text x="400" y="998" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" fill="#C7D2E8">門店只做現場不能中斷的事，其餘交給中樞與數據底座</text>

  <text x="400" y="1066" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="16" fill="#8B98AD">餐飲 SaaS 出海觀察 · 產品設計系列</text>
</svg>
