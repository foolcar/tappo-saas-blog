name = "tappo-saas-blog"
pages_build_output_dir = "dist"

# 注意：D1 / Workers AI / 環境變數綁定「不在」 wrangler.toml 裡設定。
# Pages Functions 的綁定請在 Cloudflare Dashboard 設定：
#   Workers & Pages → tappo-saas-blog → Settings → Functions
#   變數名必須為：
#     DB           → D1 資料庫（blog-comments）
#     AI           → Workers AI 綁定
#     OWNER_EMAIL  → 選用，站長信箱（留言帶「作者」徽章）
#     COMMENTS_ENABLED → 選用，預設開；設 "false" 可暫時關閉評論區
# 這些是專案層級設定，preview 與正式部署共用。
